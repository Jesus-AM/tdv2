<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Diagnóstico de Competencias Digitales UACJ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: identidad UACJ 2026 (Manual Institucional de Identidad Gráfica): banda azul institucional con la Firma Logotipo, contenido sobre blanco, amarillo solo como acento y cintillo inferior con la firma de la DGTI */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#ededed; --ink:#213455; --ink2:#4f5b70; --muted:#6e737c; --line:#dadada;
  --brand:#213455; --brand-ink:#ffffff; --brand-soft:#cfd6e8; --accent:#f0bd10; --action:#0062ae; --action-ink:#ffffff;
  --l0:#9db3d9; --l1:#4f86c6; --l2:#0062ae; --l3:#213455; --l0i:#213455; --l1i:#0f1828; --l2i:#ffffff; --l3i:#ffffff;
  --good:#0a7d0a; --warn:#8a5a00; --crit:#c23434; --good-soft:#e5f4e5; --warn-soft:#fbf1d3; --crit-soft:#fbe7e7;
  --f-display:"Noto Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Noto Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Noto Sans", "Segoe UI", system-ui, sans-serif;
  --logo-light:inline-block; --logo-dark:none;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1828; --surface:#182640; --surface2:#213455; --ink:#ededed; --ink2:#cfd6e8; --muted:#a9b4c6; --line:#2e4166;
  --brand:#213455; --brand-ink:#ffffff; --brand-soft:#24375a; --accent:#f0bd10; --action:#0062ae; --action-ink:#ffffff;
  --l0:#3f5880; --l1:#4f86c6; --l2:#8fb0dd; --l3:#cfd6e8; --l0i:#ededed; --l1i:#0f1828; --l2i:#0f1828; --l3i:#0f1828;
  --good:#3fbf3f; --warn:#f0bd10; --crit:#ee6a6a; --good-soft:#15301a; --warn-soft:#3a3116; --crit-soft:#3a1a1a;
  --logo-light:none; --logo-dark:inline-block; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1828; --surface:#182640; --surface2:#213455; --ink:#ededed; --ink2:#cfd6e8; --muted:#a9b4c6; --line:#2e4166;
  --brand:#213455; --brand-ink:#ffffff; --brand-soft:#24375a; --accent:#f0bd10; --action:#0062ae; --action-ink:#ffffff;
  --l0:#3f5880; --l1:#4f86c6; --l2:#8fb0dd; --l3:#cfd6e8; --l0i:#ededed; --l1i:#0f1828; --l2i:#0f1828; --l3i:#0f1828;
  --good:#3fbf3f; --warn:#f0bd10; --crit:#ee6a6a; --good-soft:#15301a; --warn-soft:#3a3116; --crit-soft:#3a1a1a;
  --logo-light:none; --logo-dark:inline-block; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;color:var(--ink)}
h2{font-size:1.45rem} h3{font-size:1.08rem}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
/* header */
header.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:0}
.brandmark{display:flex;align-items:center;padding:11px 0}
.brandmark{min-width:0;max-width:100%}
.brandmark img{height:42px;width:auto;max-width:100%;object-fit:contain;object-position:left;display:block}
@media (max-width:560px){.brandmark img{height:auto;width:100%}}
.titleband{border-bottom:1px solid var(--line);background:var(--surface)}
.titleband .wrap{padding-block:14px;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.titleband h1{font-size:1.45rem;font-weight:700;color:var(--ink)}
.cintillo{border-top:1px solid var(--line);background:var(--surface);margin-top:40px}
.cintillo .wrap{padding-block:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.cintillo .wrap{flex-direction:column;align-items:stretch}
.subs{display:flex;flex-wrap:wrap;gap:14px 30px;align-items:flex-start;justify-content:flex-end}
.subs .sub{border-left:1.5px solid var(--ink);padding:2px 0 2px 12px;display:inline-flex;min-height:38px}
.subs img{height:auto;max-width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--action);text-decoration:underline;cursor:pointer;font:inherit}
img.lt{display:var(--logo-light)} img.dk{display:var(--logo-dark)}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs{align-self:stretch;align-items:flex-end}
nav.tabs button{background:none;border:0;color:#cfd6e8;padding:10px 12px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-current="page"]{color:#fff;border-bottom-color:var(--accent)}
nav.tabs button:hover{color:#fff}
main{padding-block:22px 140px}
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.banner.demo{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--accent)}
.banner.info{background:var(--brand-soft);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--action)}
.btn.primary{background:var(--action);color:var(--action-ink);border-color:var(--action)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:.85rem}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.sechead p{color:var(--ink2);max-width:70ch}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.lv0{background:var(--l0);color:var(--l0i)} .lv1{background:var(--l1);color:var(--l1i)} .lv2{background:var(--l2);color:var(--l2i)} .lv3{background:var(--l3);color:var(--l3i)}
.st-good{background:var(--good-soft);color:var(--good)} .st-warn{background:var(--warn-soft);color:var(--warn)} .st-crit{background:var(--crit-soft);color:var(--crit)} .st-na{background:var(--surface2);color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--action);border-radius:5px}
.stack{display:flex;height:14px;gap:2px;border-radius:4px;overflow:hidden;min-width:120px}
.stack>i{display:block;height:100%}
.stack>i.s0{background:var(--l0)} .stack>i.s1{background:var(--l1)} .stack>i.s2{background:var(--l2)} .stack>i.s3{background:var(--l3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:600}
select,input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}
.heat td.c{text-align:center;font-family:var(--f-mono);font-size:.85rem;min-width:84px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:.8rem;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
/* survey */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.86rem;display:inline-flex;gap:6px;align-items:center}
.stepper button[aria-current="step"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.stepper button .dot{width:8px;height:8px;border-radius:50%;background:var(--l0)}
.stepper button.done .dot{background:var(--good)}
.progress{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,66px));z-index:10;background:var(--bg);padding:10px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.progress .bar{flex:1;min-width:140px}
.aviso{display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--brand)}
.aviso-body{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:.88rem;color:var(--ink2);padding-right:8px;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface)}
.aviso-body a{color:var(--action)}
.consent{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-weight:600;cursor:pointer}
.consent input{width:20px;height:20px;margin:0;accent-color:var(--action)}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.intro{grid-template-columns:1fr}}
.intro h2{font-size:1.9rem;line-height:1.15}
.scale{display:grid;gap:8px}
.scale div{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;font-size:.9rem}
.modlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.modlist .m{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.form label.f,.form div.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:.92rem;min-width:0}
.form .wide{grid-column:1/-1}
.form input[type=text],.form select{width:100%}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices .pill{font-weight:400}
.form .hint{font-weight:400;color:var(--muted);font-size:.8rem}
.cat{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:760px){.lvls{grid-template-columns:1fr}}
.card .row1{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.card .side{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:.84rem;cursor:pointer;background:var(--surface)}
.pill:has(input:checked){background:var(--brand-soft);border-color:var(--action)}
.pill input{margin:0;accent-color:var(--action)}
.optset{display:flex;flex-wrap:wrap;gap:8px}
.optset .pill small{color:var(--warn);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:180px;transition:border-color .2s}
.card.answered{border-color:color-mix(in srgb,var(--action) 45%,var(--line))}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .hd b{font-family:var(--f-display);font-size:1.05rem}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:.86rem;line-height:1.35}
.opt .lt{display:flex;gap:8px;align-items:center}
.lvcol{border:1px solid var(--line);border-radius:8px;padding:6px 10px 8px;margin:0;min-width:0;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s}
.lvcol.met{border-color:var(--action);background:color-mix(in srgb,var(--brand-soft) 45%,var(--surface))}
.lvh{display:flex;justify-content:space-between;gap:8px;width:100%;padding:0 2px;font-size:.9rem}
.lvh .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;font-weight:600}
.lvcol.met .cnt{color:var(--action)}
.ck{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:.86rem;line-height:1.35;color:var(--ink2)}
.ck:hover{background:var(--surface2)}
.ck input{width:18px;height:18px;margin:0;accent-color:var(--action);cursor:pointer}
.ck:has(input:checked){color:var(--ink)}
.opt input{margin:2px 0 0;accent-color:var(--action)}
.opt .ln{font-weight:600}
.opt ul{margin:0;padding-left:16px;color:var(--ink2)}
.opt:hover{border-color:var(--action)}
.opt:has(input:checked){background:var(--brand-soft);border-color:var(--action)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px;margin-bottom:32px;flex-wrap:wrap;align-items:center}
/* report */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
.big{font-family:var(--f-display);font-size:3.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mods .kpi .bar{margin-top:6px}
.ladder{display:inline-flex;gap:2px}
.ladder i{width:16px;height:8px;border-radius:2px;background:var(--l0)}
.ladder i.on1{background:var(--l1)} .ladder i.on2{background:var(--l2)} .ladder i.on3{background:var(--l3)}
.phase{border-left:3px solid var(--line);padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:10px}
.phase.p1{border-color:var(--crit)} .phase.p2{border-color:var(--l2)} .phase.p3{border-color:var(--accent)}
.route{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.course b{font-weight:600}
.recs{display:grid;gap:10px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.rec .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem}
details summary{cursor:pointer;color:var(--action);font-weight:500;margin-top:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const MODS = DATA.modules, TOOLS = {};
MODS.forEach(m => m.tools.forEach(t => { t.m = m.id; TOOLS[t.id] = t; }));
const MODBY = Object.fromEntries(MODS.map(m => [m.id, m]));
const LVN = ['Inicial', 'Básico', 'Intermedio', 'Avanzado'];
const PUESTOS = ['Personal operativo', 'Jefatura de función', 'Subdirección', 'Dirección', 'Personal docente'];
const TIPOS = ['Académica', 'Administrativa', 'Técnica', 'Atención o servicio', 'Directiva', 'Otra'];
const ANTIG = ['Menos de 1 año', '1 a 5 años', '6 a 10 años', '11 a 20 años', 'Más de 20 años'];
const FREQ = ['Baja (menos del 25%)', 'Media (25% a 50%)', 'Alta (51% a 75%)', 'Muy alta (más del 75%)'];
const STEPS = ['perfil', ...MODS.map(m => m.id)];
const SEC_PER_ITEM = 17;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const pct = v => v == null ? '—' : Math.round(v) + '%';
const lvFromScore = s => s == null ? null : s < 25 ? 0 : s < 50 ? 1 : s < 75 ? 2 : 3;
const chipLv = (l, txt) => l == null ? '<span class="chip st-na">Sin datos</span>' : `<span class="chip lv${l}">${txt || LVN[l]}</span>`;

/* ---------- state ---------- */
const S = {
  view: null, db: null, user: null, uid: null, canEdit: false, isOwner: false, local: false,
  responses: [], metas: {}, demo: false, demoData: null,
  me: null, nombre: '', step: 'intro', filt: { dep: '', puesto: '' }, toolMod: 'm365',
  startedAt: null,
};
function blankMe() { return { dep: '', area: '', puesto: '', tipo: '', antig: '', freq: '', datosP: '', sup: '', ans: {}, done: {}, status: 'en curso', startedAt: Date.now(), updatedAt: Date.now() }; }

/* ---------- helpers on data ---------- */
function visibleTools(mod, puesto) { return MODBY[mod].tools.filter(t => !t.doc || puesto === 'Personal docente'); }
function evalTools(mod, me) { return visibleTools(mod, me?.puesto).filter(t => !t.opt || me?.uses?.[t.id]); }
function initUses(mod) {
  S.me.uses = S.me.uses || {}; S.me.usesInit = S.me.usesInit || {};
  if (S.me.usesInit[mod]) return;
  const req = required(S.me.puesto);
  visibleTools(mod, S.me.puesto).filter(t => t.opt).forEach(t => { if (S.me.ans[t.id] != null && S.me.ans[t.id] >= -1) S.me.uses[t.id] = true; });
  S.me.usesInit[mod] = true;
}
function required(puesto) {
  const r = {};
  DATA.funcs.forEach(f => {
    const cap = f.p === puesto ? 3 : (f.p === 'Personal operativo' && f.m !== 'sii' ? 1 : 0);
    if (!cap) return;
    f.req.forEach(([id, l]) => { const v = Math.min(l, cap); if (!r[id] || r[id] < v) r[id] = v; });
  });
  return r;
}
function modScore(resp, mod) {
  const vals = visibleTools(mod, resp.puesto).map(t => resp.ans?.[t.id]).filter(v => v >= 0);
  return vals.length ? mean(vals) / 3 * 100 : null;
}
function globalScore(resp) { const s = MODS.map(m => modScore(resp, m.id)).filter(v => v != null); return s.length ? mean(s) : null; }
function isComplete(r) { return r.status === 'completa'; }
function curResponses() { return S.demo ? S.demoData.responses : S.responses; }
function curMetas() { return S.demo ? S.demoData.metas : S.metas; }

/* ---------- persistence ---------- */
let writeChain = Promise.resolve();
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function saveMe() {
  S.me.updatedAt = Date.now();
  const body = JSON.parse(JSON.stringify(S.me));
  lsSet('mdu-draft', { me: body, nombre: S.nombre });
  if (S.local || !S.db || !S.uid) { upsertLocal(body); return Promise.resolve(true); }
  writeChain = writeChain.then(async () => {
    try {
      await S.db.doc('responses/' + S.uid).set(body);
      if (S.nombre !== S._savedName) { await S.db.doc('data/users/' + S.uid + '/perfil').set({ nombre: S.nombre }); S._savedName = S.nombre; }
      return true;
    } catch (e) {
      toast(e && e.code === 'invalid_argument' ? 'No tienes permiso para enviar respuestas. Pide acceso como colaborador.' : 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');
      return false;
    }
  });
  return writeChain;
}
function upsertLocal(body) { body._id = 'local'; S.responses = [body]; }

async function boot() {
  const claude = window.claude;
  const [db, user] = claude?.use ? await Promise.all([claude.use('db'), claude.use('user')]) : [null, null];
  S.db = db; S.user = user;
  if (user) { S.uid = await user.id(); S.isOwner = await user.isOwner(); S.canEdit = await user.canEdit(); }
  const draft = lsGet('mdu-draft');
  if (!db || !S.uid) {
    S.local = true;
    if (draft?.me) { S.me = draft.me; S.nombre = draft.nombre || ''; upsertLocal(JSON.parse(JSON.stringify(S.me))); }
    S.metas = lsGet('mdu-metas') || {};
  } else {
    try {
      const snap = await db.doc('responses/' + S.uid).get();
      if (snap.exists) S.me = JSON.parse(JSON.stringify(snap.data()));
      const p = await db.doc('data/users/' + S.uid + '/perfil').get();
      if (p.exists) { S.nombre = p.data().nombre || ''; S._savedName = S.nombre; }
    } catch (e) {}
    if (!S.me && draft?.me) { S.me = draft.me; S.nombre = draft.nombre || S.nombre; }
    db.collection('responses').onSnapshot(q => { S.responses = q.docs.map(d => ({ ...d.data(), _id: d.id })); if (['avance', 'resultados'].includes(S.view)) render(); }, () => {});
    db.doc('config/metas').onSnapshot(d => { S.metas = d.exists ? (d.data().byDep || {}) : {}; if (S.view === 'avance' && !S._editingMeta) render(); }, () => {});
  }
  const h = (location.hash || '').slice(1);
  const def = ['avance', 'resultados', 'encuesta', 'informe'].includes(h) ? h :
    (S.isOwner ? 'avance' : (S.me && isComplete(S.me) ? 'informe' : 'encuesta'));
  S.privOK = !!S.me?.priv;
  if (S.me && S.me.status !== 'completa') S.step = S.privOK ? firstPendingStep() : 'intro';
  go(def);
}
function firstPendingStep() {
  if (!profileDone()) return 'perfil';
  return STEPS.find(s => s !== 'perfil' && !S.me.done?.[s]) || 'ia';
}

/* ---------- routing ---------- */
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
function go(v) {
  S.view = v;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.v === v ? 'page' : 'false'));
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
  render(); window.scrollTo({ top: 0 });
}
function render() {
  const app = $('#app');
  document.documentElement.style.setProperty('--hh', $('#hdr').offsetHeight + 'px');
  if (S.view === 'avance') app.innerHTML = viewAvance();
  else if (S.view === 'resultados') app.innerHTML = viewResultados();
  else if (S.view === 'encuesta') app.innerHTML = viewEncuesta();
  else app.innerHTML = viewInforme();
  bind();
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

/* ---------- banners ---------- */
function banners(withDemo) {
  let h = '';
  if (S.local) h += `<div class="banner info"><b>Modo sin conexión.</b> Las respuestas se guardan solo en este navegador. Abre la página con tu cuenta para enviarlas al tablero institucional.</div>`;
  if (withDemo && S.demo) h += `<div class="banner demo"><b>Datos simulados de ejemplo.</b> No son respuestas reales; sirven para ver cómo se verá el tablero. <button class="btn sm" data-act="demo-off">Volver a datos reales</button></div>`;
  return h;
}
function demoToggle() { return S.demo ? '' : `<button class="btn sm ghost" data-act="demo-on">Ver con datos de ejemplo</button>`; }

/* ================= VIEW: AVANCE ================= */
function viewAvance() {
  const R = curResponses(), M = curMetas();
  const byDep = {};
  DATA.deps.forEach(d => byDep[d] = { c: 0, p: 0, s: [] });
  R.forEach(r => { if (!r.dep) return; const b = byDep[r.dep] || (byDep[r.dep] = { c: 0, p: 0, s: [] }); if (isComplete(r)) { b.c++; const g = globalScore(r); if (g != null) b.s.push(g); } else b.p++; });
  const comp = R.filter(isComplete).length, pend = R.length - comp;
  const metaTot = Object.values(M).reduce((a, b) => a + (+b || 0), 0);
  const deps = Object.keys(byDep);
  const partic = deps.filter(d => byDep[d].c + byDep[d].p > 0).length;

function makeDemo() {
  let seed = 20261020; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const deps = DATA.deps.filter((_, i) => [0, 5, 8, 9, 10, 12, 14, 16, 18, 20, 21, 22, 23, 25].includes(i));
  const easy = new Set(['m-lists', 'm-power-bi', 'i-teachy', 'i-microsoft-copilot', 'm-word', 'm-excel', 'm-powerpoint', 'm-outlook', 'm-teams', 'm-onedrive', 'm-forms', 'i-chatgpt', 'i-canva-magic-studio', 'i-gemini', 'i-microsoft-copilot']);
  const hard = new Set(['m-power-pages', 'm-copilot-studio-power-virtual', 'm-power-apps', 'm-power-automate', 'm-power-bi', 'm-viva-insights-myanalytics', 'i-midjourney', 'i-manus', 'i-lovable', 'i-kimi', 'i-grok']);
  const base = { m365: .9, ciber: 1.4, datos: 1.0, sii: 1.1, ia: .7 };
  const metas = {}, responses = [];
  deps.forEach((d, di) => {
    const meta = 12 + Math.floor(rnd() * 26); metas[d] = meta;
    const n = Math.round(meta * (0.25 + rnd() * 0.85)); const depOff = (rnd() - .5) * 1.0;
    for (let k = 0; k < n; k++) {
      const pr = rnd(); const puesto = pr < .45 ? PUESTOS[0] : pr < .62 ? PUESTOS[1] : pr < .72 ? PUESTOS[2] : pr < .77 ? PUESTOS[3] : PUESTOS[4];
      const off = depOff + (rnd() - .5) * 1.3 + (puesto === 'Subdirección' || puesto === 'Dirección' ? .2 : 0);
      const ans = {};
      MODS.forEach(m => m.tools.forEach(t => { if (t.doc && puesto !== 'Personal docente') return; if (t.opt && rnd() > (easy.has(t.id) ? .5 : .28)) { ans[t.id] = -2; return; } if (rnd() < .05) { ans[t.id] = -1; return; } let b = base[m.id] + off + (easy.has(t.id) ? .9 : 0) - (hard.has(t.id) ? .8 : 0) + (rnd() - .5) * 1.4; ans[t.id] = Math.max(0, Math.min(3, Math.round(b))); }));
      const complete = rnd() > .12;
      responses.push({ dep: d, puesto, tipo: TIPOS[Math.floor(rnd() * 5)], ans, done: {}, status: complete ? 'completa' : 'en curso', completedAt: Date.now() - Math.floor(rnd() * 20) * 864e5 });
    }
  });
  return { metas, responses };
}

    if (t.dataset.meta != null) saveMeta(t.dataset.meta, t.value);
  };
  app.oninput = e => { const t = e.target; if (t.dataset.depsearch && DATA.deps.includes(t.value.trim())) { app.onchange(e); return; } if (t.dataset.pf === 'nombre') S.nombre = t.value.trim(); if (t.dataset.pf === 'area') S.me.area = t.value; };
  app.onfocusin = e => { if (e.target.dataset?.meta != null) S._editingMeta = true; };
  app.onfocusout = e => { if (e.target.dataset?.meta != null) S._editingMeta = false; };
}
async function saveMeta(dep, val) {
  const n = Math.max(0, parseInt(val, 10) || 0);
  if (n) S.metas[dep] = n; else delete S.metas[dep];
  if (S.local || !S.db) { lsSet('mdu-metas', S.metas); return; }
  try { await S.db.doc('config/metas').set({ byDep: { ...S.metas } }); toast('Meta guardada'); } catch (e) { toast('No se pudo guardar la meta. Solo quienes editan la página pueden cambiarla.'); }
}
/* tooltip */
const tip = $('#tip');
document.addEventListener('pointermove', e => {
  const el = e.target.closest?.('[data-tip]');
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
$('#go-aviso').addEventListener('click', () => { S.step = 'intro'; go('encuesta'); setTimeout(() => $('#aviso')?.scrollIntoView(), 50); });
window.addEventListener('resize', () => document.documentElement.style.setProperty('--hh', $('#hdr').offsetHeight + 'px'));
boot();
</script>
